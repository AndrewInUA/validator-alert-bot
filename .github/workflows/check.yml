# Wakes the checker every five minutes while this laptop is shut.
# One call per run. Calling Vercel every minute was using almost all of the
# free team's Fluid CPU, and crossing that cap pauses every project on the team.
#
# Repository secrets:
#   CHECK_URL    https://<this-project>.vercel.app/api/check
#   CRON_SECRET  the same value as CRON_SECRET on the Vercel project
name: validator-alert-check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: validator-alert-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check watched validators
        env:
          CHECK_URL: ${{ secrets.CHECK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CHECK_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "CHECK_URL and CRON_SECRET are not set on this repository."
            exit 1
          fi
          curl -fsS -m 50 -H "Authorization: Bearer $CRON_SECRET" "$CHECK_URL" || echo "check failed"
          echo
